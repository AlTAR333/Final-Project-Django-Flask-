<h2>{{ page.text }}</h2>

{% if not page.is_ending %}
<ul>
{% for choice in page.choices %}
    <li><a href="{% url 'play_story' page.story_id choice.next_page_id %}">{{ choice.text }}</a></li>
{% endfor %}
</ul>
{% else %}
<p>Fin de l’histoire !</p>
<a href="{% url 'story_list' %}">Retour aux histoires</a>
{% endif %}
