<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Interactive Stories</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>  

<nav>
    {% if user.is_authenticated %}
        Welcome {{ user.username }}
        | <a href="{% url 'story_list' %}">Stories</a>
        | <a href="{% url 'author_stories' %}">My Stories</a>
        | <a href="{% url 'stats' %}">Stats</a>
        | <form method="post" action="{% url 'logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>

    {% else %}
        <a href="{% url 'login' %}">Login</a>
        | <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

<hr>

{% block content %}
{% endblock %}

</body>
</html>
